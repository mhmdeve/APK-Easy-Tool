name: Build APK Easy Tool

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release from this build'
        required: true
        default: false
        type: boolean
      tag:
        description: 'Release tag (required when creating a release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build AnyCPU
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Apktool 2.x and 3.x
        shell: pwsh
        run: |
          $apktoolDir = Join-Path $env:GITHUB_WORKSPACE 'Resources\\Apktool'
          New-Item -ItemType Directory -Force -Path $apktoolDir | Out-Null
          Remove-Item (Join-Path $apktoolDir '*.jar') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $apktoolDir '*.bin') -Force -ErrorAction SilentlyContinue
          $apktool2 = Join-Path $apktoolDir 'apktool_2.12.1.jar'
          $apktool3Real = Join-Path $apktoolDir 'apktool_3.0.3.bin'
          $apktool3Wrapper = Join-Path $apktoolDir 'apktool_3.0.3.jar'
          Invoke-WebRequest -Uri 'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar' -OutFile $apktool2
          Invoke-WebRequest -Uri 'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' -OutFile $apktool3Real
          if (-not (Test-Path $apktool2)) { Write-Error 'Apktool 2.12.1 was not downloaded.'; exit 1 }
          if (-not (Test-Path $apktool3Real)) { Write-Error 'Apktool 3.0.3 was not downloaded.'; exit 1 }
          $expectedSha256 = 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423'
          $actualSha256 = (Get-FileHash $apktool3Real -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { Write-Error "Apktool 3.0.3 SHA-256 mismatch. Expected $expectedSha256, got $actualSha256"; exit 1 }
          $wrapperClassDir = Join-Path $env:RUNNER_TEMP 'apktool3-wrapper'
          New-Item -ItemType Directory -Force -Path $wrapperClassDir | Out-Null
          javac -d $wrapperClassDir build\\Apktool3Compat.java
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to compile the Apktool 3.x compatibility launcher.'; exit 1 }
          Push-Location $wrapperClassDir
          jar cfe $apktool3Wrapper Apktool3Compat Apktool3Compat.class
          $jarExit = $LASTEXITCODE
          Pop-Location
          if ($jarExit -ne 0 -or -not (Test-Path $apktool3Wrapper)) { Write-Error 'Failed to package the Apktool 3.x compatibility launcher.'; exit 1 }
          java -jar $apktool2 --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'Apktool 2.12.1 failed its smoke test.'; exit 1 }
          java -jar $apktool3Real --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'Apktool 3.0.3 failed its smoke test.'; exit 1 }
          java -jar $apktool3Wrapper --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'Apktool 3.0.3 compatibility launcher failed its smoke test.'; exit 1 }

      - name: Restore NuGet packages
        run: nuget restore APKEasyTool.sln

      - name: Build Release
        shell: pwsh
        run: >-
          msbuild APKEasyTool.sln /m /t:Build
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:Win32Resource="${{ github.workspace }}\\APKEasyTool\\Resource.res"

      - name: Verify executable and bundled Apktool versions
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'APKEasyTool/bin/Release'
          $exe = Join-Path $output 'apkeasytool.exe'
          $apktoolOutput = Join-Path $output 'Apktool'
          if (-not (Test-Path $exe)) { Write-Error "Build output not found: $exe"; exit 1 }
          $sourceApktool = Join-Path $env:GITHUB_WORKSPACE 'Resources/Apktool'
          New-Item -ItemType Directory -Force -Path $apktoolOutput | Out-Null
          Copy-Item (Join-Path $sourceApktool 'apktool_2.12.1.jar') $apktoolOutput -Force
          Copy-Item (Join-Path $sourceApktool 'apktool_3.0.3.jar') $apktoolOutput -Force
          Copy-Item (Join-Path $sourceApktool 'apktool_3.0.3.bin') $apktoolOutput -Force
          foreach ($file in @('apktool_2.12.1.jar','apktool_3.0.3.jar','apktool_3.0.3.bin')) { if (-not (Test-Path (Join-Path $apktoolOutput $file))) { Write-Error "Required bundled file missing: $file"; exit 1 } }

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'APKEasyTool/bin/Release/*' -DestinationPath 'artifacts/APK-Easy-Tool-v1.62-AnyCPU.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Easy-Tool-v1.62-AnyCPU
          path: artifacts/APK-Easy-Tool-v1.62-AnyCPU.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: inputs.create_release == true && inputs.tag != ''
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: APK-Easy-Tool-v1.62-AnyCPU
          path: release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
