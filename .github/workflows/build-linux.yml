name: Build Linux APK Easy Tool

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore linux/ApkEasyTool.Linux/ApkEasyTool.Linux.csproj
      - name: Build
        run: dotnet build linux/ApkEasyTool.Linux/ApkEasyTool.Linux.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test linux/ApkEasyTool.Linux.Tests/ApkEasyTool.Linux.Tests.csproj --configuration Release
      - name: Publish Linux x64
        run: dotnet publish linux/ApkEasyTool.Linux/ApkEasyTool.Linux.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/linux-x64
      - name: Build Debian package
        run: bash linux/package/build-deb.sh artifacts/linux-x64 artifacts/deb
      - uses: actions/upload-artifact@v4
        with:
          name: apk-easy-tool-linux-x64
          path: artifacts/linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: apk-easy-tool-linux-x64-deb
          path: artifacts/deb/*.deb
